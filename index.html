/* Eigene Optik der öffentlichen Edition: dunkles Blau, Blau als Akzent, Türkis für Beschriftungen,
   Bernstein-Verlauf für die Bonus-Zone. Das Blatt hat helle Felder, abwechselnd hell/grau. */
:root{
  --black:#0f1720;--case:#17212d;--case2:#1f2c3b;--edge:#33465b;
  --text:#f1f5f9;--text2:#9fb0c3;
  --pink:#2f6fed;--pink-dim:#172a52;--pink-ink:#fff;
  --lime:#7ee0c3;--green:#0f8b8d;--green-dim:#10343a;--ink:#101722;
  --paper:#f4f6f9;--paper2:#ccd5df;
  --z3:#fdf0d0;--z4:#fbe0a3;--z5:#f8cc72;--z6:#f3b244;
  --bad:#ff6b6b;--r:16px;--rs:11px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;-webkit-text-size-adjust:100%;}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--black);color:var(--text);
  max-width:540px;margin:0 auto;min-height:100vh;font-weight:500;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;}
button:disabled{cursor:not-allowed;}
@keyframes flapflip{0%{transform:perspective(240px) rotateX(0)}46%{transform:perspective(240px) rotateX(88deg);opacity:.55}
  47%{transform:perspective(240px) rotateX(-88deg)}100%{transform:perspective(240px) rotateX(0)}}
.flap-flip{animation:flapflip .34s ease-out;}
@keyframes puls{0%,100%{box-shadow:0 0 0 0 rgba(47,111,237,.55)}50%{box-shadow:0 0 0 6px rgba(47,111,237,0)}}
@media(prefers-reduced-motion:reduce){.flap-flip,.sc.next,.d12.roll{animation:none!important;}*,*::before,*::after{transition:none!important;}}

/* ── Kopf ── */
.kopf{position:sticky;top:0;z-index:20;background:var(--black);border-bottom:2px solid var(--pink);
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px;}
.logo{display:flex;align-items:center;gap:7px;min-width:0;flex:1;}
.logo svg{width:30px;height:30px;flex-shrink:0;}
.logo b{display:block;font-weight:800;font-size:15px;line-height:.98;letter-spacing:.01em;text-transform:uppercase;color:#fff;}
.logo small{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;color:var(--lime);margin-top:2px;white-space:nowrap;}
.pille{background:var(--pink);color:#fff;border-radius:20px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap;flex-shrink:0;}
.pille span{opacity:.7;font-weight:600;}
.total{background:var(--paper);color:var(--ink);border-radius:8px;font-weight:800;font-size:17px;padding:2px 10px;min-width:48px;text-align:center;
  flex-shrink:0;font-variant-numeric:tabular-nums;cursor:pointer;border:none;position:relative;line-height:1.5;}
.total::after{content:'';position:absolute;left:6%;right:6%;top:50%;height:1px;background:rgba(0,0,0,.2);}
.ikn{width:38px;height:38px;border:1.5px solid var(--edge);border-radius:var(--rs);background:var(--case);color:var(--text2);
  display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.ikn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.ikn.on{color:var(--lime);border-color:var(--lime);background:var(--green-dim);}
.ikn:disabled{opacity:.3;}
@media(max-width:400px){.logo svg{display:none}.kopf{gap:6px;padding-left:10px;padding-right:10px}.ikn{width:36px;height:36px}.logo b{font-size:12px;letter-spacing:0}}

/* ── Tabs ── */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:var(--black);
  border-top:2px solid var(--edge);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px 10px;border:none;background:none;
  color:var(--text2);font-size:11px;font-weight:700;min-height:56px;}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab.an{color:var(--pink);}

.screen{padding:12px 12px 8px;}
.karte{background:var(--case);border:1.5px solid var(--edge);border-radius:var(--r);padding:12px;margin-bottom:12px;}
.kopfz{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.titel{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);}
.titel.g{color:var(--lime);}
.klein{font-size:12px;color:var(--text2);line-height:1.45;font-weight:500;}
.klein b{color:var(--text);}

/* ── Rundenwahl ── */
.rnav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.rnb{width:46px;height:46px;border:1.5px solid var(--edge);border-radius:var(--rs);background:var(--case);color:#fff;font-size:20px;font-weight:700;flex-shrink:0;}
.rnb:disabled{opacity:.3;}
.rtitel{flex:1;text-align:center;font-weight:800;font-size:18px;line-height:1.15;}
.rtitel small{display:block;font-size:11px;font-weight:600;color:var(--text2);}
.status{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1.5px solid var(--edge);color:var(--text2);}
.status.gesichert{color:var(--lime);border-color:var(--lime);}
.status.genullt{color:var(--bad);border-color:var(--bad);}
.status.zukunft{border-style:dashed;}
.rtitel{min-width:0;}
.rpunkte{flex-shrink:0;text-align:center;}
.rpunkte small{display:block;font-size:10px;font-weight:700;color:var(--text2);margin-top:2px;letter-spacing:.04em;text-transform:uppercase;}
.flap.leer::after{display:none;}
.flap.rp{font-size:28px;padding:1px 12px;line-height:1.3;min-width:58px;}
@media(max-width:400px){.rnb{width:40px;height:40px}.rnav{gap:6px}.flap.rp{font-size:25px;padding:1px 9px;min-width:50px}}

/* ── Deine Zeile (große Version der Rundenzeile) ── */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;position:relative;}
.sz{display:flex;align-items:center;justify-content:center;height:24px;border-radius:12px;font-weight:800;font-size:12px;
  background:var(--pink-dim);color:#9db8ff;border:1.5px solid transparent;}
.sz.hit{background:var(--pink);color:#fff;border-color:#fff;box-shadow:0 0 14px rgba(47,111,237,.7);}
.zonenkopf{grid-column:1/4;display:flex;align-items:center;font-size:9.5px;font-weight:700;color:var(--text2);line-height:1.2;padding-right:4px;}
.cl{background:var(--green);color:#fff;border-radius:6px;font-weight:800;font-size:11px;text-align:center;padding:2px 0;margin-top:3px;}
.sc{position:relative;height:58px;border-radius:11px;background:var(--paper);color:var(--ink);font-weight:800;font-size:23px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;border:2.5px solid transparent;padding:0;line-height:1;font-variant-numeric:tabular-nums;}
.sc.z3{background:var(--z3)}.sc.z4{background:var(--z4)}.sc.z5{background:var(--z5)}.sc.z6{background:var(--z6)}
.sc.p{color:var(--pink);}
.sc.p small{font-size:12px;font-weight:700;color:var(--ink);margin-top:1px;}
.sc.leer{color:#b9b3b0;font-size:14px;font-weight:700;}
.sc.next{border-color:var(--pink);animation:puls 1.5s infinite;}
.sc.kl{box-shadow:inset -6px 0 0 var(--lime);}
.sc.kl::after{content:')';position:absolute;top:-8px;right:-5px;width:19px;height:19px;border-radius:50%;background:var(--lime);color:var(--ink);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;}
.sc.fl{cursor:pointer;}
.strip.null .sc.fl:not(.keep){opacity:.4;}
.strip.null .sc.fl:not(.keep)::before{content:'';position:absolute;left:8%;right:8%;top:50%;height:3px;background:var(--bad);transform:rotate(-14deg);border-radius:2px;}
.hinweis{font-size:12.5px;line-height:1.45;color:var(--text2);margin-top:10px;}
.hinweis b{color:#fff;}
.geist{font-size:12.5px;color:var(--text2);margin-top:8px;line-height:1.4;}.geist b{color:#fff;}.geist .plus{color:var(--lime);font-weight:800;}.geist .minus{color:var(--bad);font-weight:800;}.geist small{font-size:11px;}
.geistend{margin-top:12px;padding:10px 12px;border-radius:var(--rs);border:2px solid var(--edge);text-align:left;}.geistend>b{font-size:15px;}.geistend.sieg{border-color:var(--lime);}.geistend.sieg>b{color:var(--lime);}.geistend.niederlage{border-color:var(--bad);}.geistend.niederlage>b{color:var(--bad);}
.blist{margin:8px 0;max-height:46vh;overflow-y:auto;}.brow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--edge);}.brow.me{background:var(--pink-dim);border-radius:8px;}
.brow .bp{width:24px;text-align:center;font-weight:800;color:var(--text2);}.brow .bn{flex:1;min-width:0;font-weight:700;font-size:14px;}.brow .bn small{display:block;font-size:11px;color:var(--text2);font-weight:500;}.brow>b{font-size:18px;font-variant-numeric:tabular-nums;}

/* ── Zahlenfeld ── */
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;}
.pad button{height:60px;border-radius:var(--rs);border:1.5px solid var(--edge);background:var(--case2);color:#fff;
  font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;}
.pad button:active:not(:disabled){background:var(--pink);border-color:var(--pink);}
.pad button.drin{background:var(--pink-dim);border-color:var(--pink);color:#9db8ff;}
.pad button:disabled{opacity:.28;}
.zeile2{display:flex;gap:8px;margin-top:9px;}
.btn{flex:1;min-height:50px;border-radius:var(--rs);border:2px solid transparent;font-weight:800;font-size:14px;letter-spacing:.02em;
  text-transform:uppercase;padding:6px 10px;}
.btn.pink{background:var(--pink);color:#fff;}
.btn.gruen{background:var(--green);color:#10200a;}
.btn.rand{background:none;border-color:var(--pink);color:var(--pink);}
.btn.still{background:var(--case2);border-color:var(--edge);color:var(--text);}
.btn.gross{min-height:56px;font-size:15px;}
.btn:disabled{opacity:.3;}
.btn small{display:block;font-size:10px;font-weight:600;text-transform:none;letter-spacing:0;opacity:.8;}

/* ── Joker ── */
.jokers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;}
.jk{border-radius:var(--rs);border:2px solid var(--paper);background:var(--black);padding:8px 2px 6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;min-height:76px;}
.jk b{font-size:25px;font-weight:800;line-height:1;color:#fff;}
.jk span{font-size:9.5px;font-weight:700;line-height:1.15;text-align:center;color:var(--text2);}
.jk.leer{border-style:dashed;border-color:var(--edge);}
.jk.leer b{color:var(--text2);}
.jk.weg{border-color:var(--edge);}
.jk.weg b{text-decoration:line-through;color:var(--text2);}
.jk.hier{border-color:var(--lime);}
.jk.hier b{color:var(--lime);text-decoration:none;}
.jk.scharf{border-color:var(--lime);background:var(--green-dim);box-shadow:0 0 14px rgba(126,224,195,.45);}
.jk.scharf b{color:var(--lime);}

/* ── Rundensumme ── */
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sum .l{min-width:0;}
.sum .l b{display:block;font-weight:800;font-size:15px;}
.flap{background:var(--paper);color:var(--ink);border-radius:10px;font-weight:800;font-variant-numeric:tabular-nums;position:relative;
  padding:3px 16px;font-size:34px;line-height:1.3;flex-shrink:0;}
.flap::after{content:'';position:absolute;left:5%;right:5%;top:50%;height:1px;background:rgba(0,0,0,.2);}
.banner{background:var(--pink-dim);border:1.5px solid var(--pink);border-radius:var(--rs);padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px;}
.banner b{color:var(--pink);}

/* ── Spielblatt (Übersicht) ── */
.name{background:var(--paper);color:var(--ink);border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.name small{color:#8a8582;font-weight:700;font-size:9px;margin-right:6px;letter-spacing:.05em;}
.bl{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr)) minmax(0,1.35fr) minmax(0,1.45fr);gap:3px;}
.bl .h{display:flex;align-items:center;justify-content:center;border-radius:5px;font-weight:800;font-size:10px;color:#fff;background:var(--green);height:21px;}
.bl .h.pk{background:var(--green);font-size:8.5px;letter-spacing:.01em;}
.bl .zh{height:21px;border-radius:5px;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;}
.bl .zl{grid-column:1/5;font-size:9px;color:var(--text2);display:flex;align-items:center;font-weight:700;}
.bl .zl2{grid-column:9/11;}
.bl .rl{height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;border:none;padding:0;}
.bl .rl.o{background:var(--pink);}.bl .rl.e{background:var(--green);}
.bl .c{height:38px;border-radius:5px;background:var(--paper);color:var(--ink);font-weight:700;font-size:14px;display:flex;align-items:center;
  justify-content:center;position:relative;font-variant-numeric:tabular-nums;border:none;padding:0;overflow:hidden;}
.bl .c.e{background:var(--paper2);}
.bl .c.z3{background:var(--z3)}.bl .c.z4{background:var(--z4)}.bl .c.z5{background:var(--z5)}.bl .c.z6{background:var(--z6)}
.bl .c.p{color:var(--pink);font-size:12px;font-weight:800;}
.bl .c.kl::after{content:'';position:absolute;right:0;top:3px;bottom:3px;width:4px;background:var(--lime);border-radius:2px;}
.bl .c.nul{opacity:.38;}
.bl .c.nul::before{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--bad);transform:rotate(-16deg);}
.bl .c.pt{font-weight:800;font-size:15px;}
.bl .c.pt.n0{color:var(--bad);}
.bl .c.pt.leer,.bl .c.ge.leer{color:#aaa5a2;font-weight:600;}
.bl .c.ge{font-weight:800;font-size:14px;}
.bl .cur{box-shadow:0 0 0 2px var(--pink);}
.bl .rl.cur{box-shadow:0 0 0 2px #fff;}
.bl .c.edit::after{content:'✎';position:absolute;top:1px;right:3px;font-size:8px;color:var(--pink);}

/* ── Karten & Regeln ── */
.akt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--edge);}
.akt:last-child{border-bottom:none;}
.akt .n{flex:0 0 38px;height:30px;border-radius:8px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;color:#fff;}
.akt.pink .n{background:var(--pink);}.akt.gruen .n{background:var(--green);color:#10200a;}
.akt b{display:block;font-size:14px;font-weight:700;}
.akt.pink b{color:#9db8ff;}.akt.gruen b{color:var(--lime);}
.akt p{font-size:12.5px;color:var(--text2);line-height:1.5;margin-top:1px;}
.regeln h3{font-size:14px;font-weight:800;color:var(--lime);margin:2px 0 6px;}
.regeln p,.regeln li{font-size:13px;line-height:1.6;color:var(--text2);}
.regeln li{margin:3px 0;}.regeln ul{padding-left:18px;}
.regeln b{color:var(--text);}
.regeln table{width:100%;border-collapse:collapse;margin:6px 0 2px;}
.regeln td{padding:6px 8px;border-bottom:1px solid var(--edge);font-size:13px;color:var(--text);}
.regeln td:last-child{text-align:right;font-weight:800;color:var(--pink);}
.leiste{display:flex;gap:8px;margin-bottom:12px;}

/* ── Dialoge ── */
.ov{position:fixed;inset:0;background:rgba(8,6,6,.78);backdrop-filter:blur(4px);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0;}
.dlg{background:var(--case);border:2px solid var(--pink);border-bottom:none;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));
  width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.6);}
@media(min-width:700px){.ov{align-items:center;padding:16px}.dlg{border-radius:20px;border-bottom:2px solid var(--pink);max-width:480px}}
.dt{font-weight:800;font-size:19px;text-align:center;color:#fff;margin-bottom:4px;line-height:1.2;}
.ds{font-size:13px;color:var(--text2);text-align:center;line-height:1.5;margin-bottom:12px;}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--black);border:2px solid var(--edge);border-radius:var(--rs);padding:11px 13px;min-height:56px;}
.opt:active{border-color:var(--pink);background:var(--pink-dim);}
.opt .ic{font-weight:800;font-size:22px;width:34px;text-align:center;flex-shrink:0;line-height:1;}
.opt .nm{font-weight:800;font-size:14px;color:#fff;}
.opt .bs{font-size:12px;color:var(--text2);line-height:1.4;margin-top:1px;}
.opt.bad .nm{color:var(--bad);}
.opt.gruen{border-color:#1f5d52;}.opt.gruen .nm{color:var(--lime);}
.opt.pink{border-color:#2c4a8f;}.opt.pink .nm{color:#9db8ff;}
.raster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.raster .opt{padding:9px 10px;gap:9px;min-height:58px;}.raster .opt .ic{font-size:18px;width:26px;}.raster .opt .nm{font-size:13px;line-height:1.2;}.raster .opt .bs{font-size:11px;}
.wahl{display:flex;gap:8px;margin-bottom:12px;}
.wahl button{flex:1;min-height:46px;border-radius:var(--rs);border:2px solid var(--edge);background:var(--black);font-weight:800;font-size:13px;}
.wahl button.an{border-color:var(--pink);background:var(--pink-dim);color:#fff;}
.pad.k{margin-bottom:8px;}
.pad.k button{height:52px;font-size:19px;}
.abbr{width:100%;min-height:46px;margin-top:6px;background:none;border:2px solid var(--edge);border-radius:var(--rs);color:var(--text2);font-weight:700;font-size:13px;}
.nin{width:100%;height:50px;background:var(--black);border:2px solid var(--edge);border-radius:var(--rs);color:#fff;padding:0 14px;font-size:17px;font-family:inherit;font-weight:600;margin-bottom:12px;}
.nin:focus{outline:none;border-color:var(--pink);}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--edge);}
.step .l{min-width:0;}.step .l b{font-size:14px;font-weight:700;display:block;}.step .l small{font-size:11.5px;color:var(--text2);}
.step .s{display:flex;align-items:center;gap:6px;}
.step .s button{width:42px;height:42px;border-radius:var(--rs);border:2px solid var(--edge);background:var(--black);font-size:20px;font-weight:700;}
.step .s span{min-width:44px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;}
.zerl{background:var(--black);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.7;}
.zerl div{display:flex;justify-content:space-between;}.zerl div b{font-variant-numeric:tabular-nums;}
.zerl .su{border-top:1px solid var(--edge);margin-top:4px;padding-top:4px;font-weight:800;color:#fff;font-size:15px;}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));pointer-events:none;max-width:420px;width:calc(100% - 28px);
  background:var(--paper);color:var(--ink);padding:11px 15px;border-radius:var(--rs);font-size:13px;font-weight:600;line-height:1.45;z-index:70;
  box-shadow:0 6px 24px rgba(0,0,0,.5);border-left:6px solid var(--pink);}
#nosleep-vid{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;}

/* ── Würfel, Karten, Spieler ── */
.dwrap{--a:30px;width:calc(var(--a)*2.8);height:calc(var(--a)*2.8);perspective:620px;display:flex;align-items:center;justify-content:center;}
.d12{position:relative;width:0;height:0;transform-style:preserve-3d;}
.d12.roll{animation:d12roll 1.1s cubic-bezier(.2,.7,.25,1) both;}
@keyframes d12roll{from{transform:var(--von)}to{transform:var(--ziel)}}
.wf{position:absolute;left:calc(var(--a)*-.809);top:calc(var(--a)*-.8507);width:calc(var(--a)*1.618);height:calc(var(--a)*1.5388);transform-origin:50% 55.3%;
  clip-path:polygon(50% 0,100% 38.2%,80.9% 100%,19.1% 100%,0 38.2%);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#e9f0ff;}
.wf i{position:absolute;inset:0;clip-path:polygon(50% 0,100% 38.2%,80.9% 100%,19.1% 100%,0 38.2%);transform:scale(.9);transform-origin:50% 55.3%;background:linear-gradient(160deg,#3a7bff,#2358c9);}
.wf.o i{background:linear-gradient(160deg,#5b94ff,#2f6fed);}
.wf.l i{background:linear-gradient(160deg,#2f6fed,#1c47a8);}
.wf.b i{background:linear-gradient(160deg,#2358c9,#173b8a);}
.wf.eu i{background:linear-gradient(160deg,#12a3a5,#0a5f66);}
.wf b{position:absolute;left:0;right:0;top:55.3%;transform:translateY(-50%);text-align:center;color:#fff;font-weight:800;font-size:calc(var(--a)*.62);line-height:1;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.35);}
.wf b svg{width:calc(var(--a)*.95);height:calc(var(--a)*.95);}
.fenster{overflow-x:hidden;box-sizing:border-box}.fenster *{min-width:0}.fenster .fz{min-width:58px}.dice{display:flex;justify-content:center;gap:10px;margin:4px 0 10px;}
.kartenreihe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px;}
.kart{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;border:2px solid var(--pink);background:var(--black);text-align:center;min-height:150px;}
.kart:active{background:var(--pink-dim);}
.kart .ks{font-size:30px;font-weight:800;color:#9db8ff;line-height:1.1;}
.kart .kn{font-size:12px;font-weight:800;color:#fff;line-height:1.2;}
.kart .kt{font-size:10.5px;font-weight:600;color:var(--text2);line-height:1.35;}
.spleiste{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.sp{flex:1 0 84px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 6px;border-radius:var(--rs);border:2px solid var(--edge);background:var(--case);}
.sp b{font-size:13px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sp span{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--lime);}
.sp small{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
.sp.an{border-color:var(--pink);background:var(--pink-dim);}
.rang{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-top:8px;border-radius:var(--rs);border:2px solid var(--edge);background:var(--black);text-align:left;}
.rang.an{border-color:var(--pink);}
.rang .pl{font-weight:800;color:var(--lime);width:26px;}
.rang .nm{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rang .ge{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;}
.rang small{font-size:10.5px;color:var(--text2);font-weight:700;}
.step .s button.tg{width:auto;padding:0 14px;font-size:13px;font-weight:800;}
.step .s button.an{border-color:var(--pink);background:var(--pink-dim);color:#fff;}

/* ── Spielfenster im Vordergrund, Spielblatt dahinter ── */
.fenster{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));width:100%;max-width:540px;z-index:30;
  background:var(--case);border:2px solid var(--pink);border-bottom:none;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6);
  padding:10px 12px 12px;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);overflow-y:auto;}
.fkopf{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.fname{flex:1;min-width:0;}
.fname b{display:block;font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fname small{display:block;font-size:11px;font-weight:700;color:var(--text2);}
.fz{background:var(--paper);color:var(--ink);border-radius:9px;padding:2px 10px;text-align:center;min-width:58px;}
.fz span{display:block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b7683;}

<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Eulen-Würfelspiel – Wertungsblock (inoffiziell): ein Handy/Tablet = ein Spielblatt.
   10 Rundenzeilen mit Start und 6 Würfen, Bonus-Zone ab Wurf 3 (+5/+10/+15/+20),
   Punkte- und Gesamt-Spalte, drei Joker und zwei Bonus-Joker-Felder.
   Die vollständigen Regeln stehen in der Anleitung des Spiels.
   ═══════════════════════════════════════════════════════════════════ */
const RUNDEN = 10, ZIEL = 222, FELDER = 7;
const FN = ['Start', '1', '2', '3', '4', '5', '6'];
const feldName = i => (i ? 'Wurf ' + i : 'Startwert');
const BONUS = [0, 0, 0, 5, 10, 15, 20];          // nach Feldposition des letzten erfolgreichen Wurfs
const SPEICHER = 'hdp2_state', PARTEI = 'hdp2_party', PREFS = 'hdp2_wake';
const JOKERNAME = { sn: 'Klammer-Joker', zc: 'Wiederholungs-Joker', ep: 'Pasch-Joker' };
const JOKERKURZ = { sn: 'Klammer', zc: 'Nochmal', ep: 'Pasch' };
const JOKERZEICHEN = { sn: ')', zc: '2', ep: 'P' };

/* ── Würfel: zwei W12, auf der 1 sitzt die Eule ── */
const EULE_WERT = 1;
const WURFDAUER = (typeof matchMedia === 'function' && !matchMedia('(prefers-reduced-motion: reduce)').matches) ? 1100 : 0;
function zufall(n) { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } }
function mischen(a) { const x = a.slice(); for (let i = x.length - 1; i > 0; i--) { const j = zufall(i + 1); [x[i], x[j]] = [x[j], x[i]]; } return x; }
const wurfWert = (a, b) => (a === EULE_WERT && b === EULE_WERT ? 15 : Math.max(a, b));   // Karten-Wurf: höherer Würfel, zwei Eulen = 15

/* ── Eigenes Kartendeck dieser App (keine Karten aus dem Originalspiel) ── */
const KARTEN = {
  f5: { name: 'Kleiner Fund', sym: '5', text: '5 Punkte ins P-Feld', v: 5 },
  f7: { name: 'Guter Fund', sym: '7', text: '7 Punkte ins P-Feld', v: 7 },
  f10: { name: 'Großer Fund', sym: '10', text: '10 Punkte ins P-Feld', v: 10 },
  w2: { name: 'Glückswurf', sym: '×2', text: 'Du wirfst nochmal, der höhere Würfel zählt doppelt', mal: 2 },
  w1: { name: 'Zusatzwurf', sym: '↻', text: 'Du wirfst nochmal, der höhere Würfel zählt', mal: 1 },
  rx: { name: 'Doppelrunde', sym: '×', text: 'Die ganze Runde zählt doppelt', fx: 'doppelt' },
  bs: { name: 'Klammer-Geschenk', sym: ')', text: 'Du erhältst einen Bonus-Joker Klammer', fx: 'bsn' },
  bz: { name: 'Nochmal-Geschenk', sym: '2', text: 'Du erhältst einen Bonus-Joker Wiederholung', fx: 'bzc' },
  l0: { name: 'Leerer Zug', sym: '–', text: 'Keine Punkte, keine Wirkung', v: 0 }
};
const DECK = { f5: 5, f7: 4, f10: 3, w2: 3, w1: 4, rx: 2, bs: 2, bz: 2, l0: 5 };   // 30 Karten
const PASCHKARTEN = 1, EULENPASCHKARTEN = 3;      // normaler Pasch: 1 Karte. Zwei Eulen: 3 Karten ziehen, eine davon wählen
function neuesDeck() { const d = []; Object.keys(DECK).forEach(k => { for (let i = 0; i < DECK[k]; i++) d.push(k); }); return d; }

/* ── Geist-Gegner (nur Einzelspiel): simulierter Spieler mit festen Regeln. Seine 10 Runden werden beim Start ausgewürfelt ── */
const GEIST = { 1: { name: 'Vorsichtig', risiko: 0.10 }, 2: { name: 'Normal', risiko: 0.18 }, 3: { name: 'Riskant', risiko: 0.26 } };
function geistNullRisiko(zahlen) {              // Wahrscheinlichkeit, dass der nächste Wurf nullt (doppelte Zahl, keine Eule, kein Pasch)
  let c = 0;
  for (let a = 1; a <= 12; a++) for (let b = 1; b <= 12; b++) if (a !== b && a !== EULE_WERT && b !== EULE_WERT && zahlen.includes(Math.max(a, b))) c++;
  return c / 144;
}
function geistKarte(basis) {
  const pool = neuesDeck(), k = pool[zufall(pool.length)], c = KARTEN[k];
  if (c.mal) return { v: wurfWert(zufall(12) + 1, zufall(12) + 1) * c.mal, dop: false };
  if (c.fx === 'doppelt') return { v: 0, dop: true, schaetz: basis };
  return { v: c.v || 0, dop: false };
}
function geistRunde(stufe) {
  const lim = GEIST[stufe].risiko, zahlen = []; let felder = 0, pv = 0, dop = false;
  for (let g = 0; g < 300 && felder < FELDER; g++) {
    if (felder > 0 && geistNullRisiko(zahlen) > lim) break;
    const a = zufall(12) + 1, b = zufall(12) + 1, basis = zahlen.reduce((t, x) => t + x, 0) + pv;
    if (a === b) {                                // Pasch: 1 Karte, Eulen-Pasch 3 Karten und die beste wählen
      const kk = Array.from({ length: a === EULE_WERT ? EULENPASCHKARTEN : PASCHKARTEN }, () => geistKarte(basis));
      kk.sort((x, y) => (y.schaetz || y.v) - (x.schaetz || x.v));
      pv += kk[0].v; if (kk[0].dop) dop = true; felder++; continue;
    }
    const n = Math.max(a, b);
    if (zahlen.includes(n)) { if (a === EULE_WERT || b === EULE_WERT) continue; return { p: 0, status: 'genullt', felder }; }   // Eule rettet
    zahlen.push(n); felder++;
  }
  let p = zahlen.reduce((t, x) => t + x, 0) + pv + BONUS[Math.max(0, Math.min(felder - 1, 6))];
  if (dop) p *= 2;
  return { p, status: 'gesichert', felder };
}
const geistErzeugen = stufe => (stufe > 0 ? { stufe, runden: Array.from({ length: RUNDEN }, () => geistRunde(stufe)) } : null);

const neueRunde = () => ({ f: [], klammer: null, status: 'offen', zc: false, doppelt: false, korr: 0, override: null });
const neueJoker = () => [{ typ: 'sn', used: null }, { typ: 'zc', used: null }, { typ: 'ep', used: null }, { typ: null, used: null }, { typ: null, used: null }];
const neuerStand = () => ({ v: 3, setupDone: false, name: '', cur: 0, tab: 'spiel', phase: 'play',
  rounds: Array.from({ length: RUNDEN }, neueRunde), joker: neueJoker(), pendingNew: false, dialog: null, wurf: null, panel: true, setup: null });
let state = neuerStand();
let verlauf = [];

/* ── Partie: ein oder mehrere Spielblätter. Das aktive Blatt liegt in `state`, alle anderen in party.sheets ── */
const BLATTFELDER = ['name', 'cur', 'phase', 'rounds', 'joker'];
const kopie = o => JSON.parse(JSON.stringify(o));
const neuesBlatt = name => ({ name, cur: 0, phase: 'play', rounds: Array.from({ length: RUNDEN }, neueRunde), joker: neueJoker() });
const neuePartie = (namen, digW, digK, geist) => ({ sheets: namen.map(neuesBlatt), active: 0, digW, digK, zielAktiv: false, deck: mischen(neuesDeck()), ablage: [], geistStufe: geist == null ? null : geist, geist: geistErzeugen(geist || 0), pid: Math.random().toString(36).slice(2) + Date.now().toString(36) });
let party = neuePartie([''], true, true);
const mehrere = () => party.sheets.length > 1;
function sync() { const o = {}; BLATTFELDER.forEach(k => { o[k] = state[k]; }); party.sheets[party.active] = kopie(o); }
function blattLaden(extra) { Object.assign(state, kopie(party.sheets[party.active]), { dialog: null, wurf: null }, extra || {}); }
function spielerWechseln(i) {
  if (i < 0 || i >= party.sheets.length || i === party.active) return;
  sync(); party.active = i; blattLaden();
}

function speichern() {
  try {
    sync();
    localStorage.setItem(SPEICHER, JSON.stringify({ ...state, dialog: null, wurf: null, setup: null }));
    localStorage.setItem(PARTEI, JSON.stringify(party));
  } catch (e) {}
}
function laden() {
  try {
    const s = JSON.parse(localStorage.getItem(SPEICHER) || 'null'), p = JSON.parse(localStorage.getItem(PARTEI) || 'null');
    if (s && s.v === 3 && Array.isArray(s.rounds) && s.rounds.length === RUNDEN && p && Array.isArray(p.sheets) && p.sheets.length && p.active < p.sheets.length) {
      state = { ...neuerStand(), ...s, dialog: null, pendingNew: false, wurf: null, setup: null }; party = p;
    }
  } catch (e) {}
}
function merken() {
  sync();
  verlauf.push(JSON.stringify({ s: { ...state, dialog: null, wurf: null, setup: null }, p: party }));
  if (verlauf.length > 80) verlauf.shift();
}
function zurueck() {
  if (!verlauf.length) return;
  const tab = state.tab, x = JSON.parse(verlauf.pop());
  party = x.p; state = { ...neuerStand(), ...x.s, tab, dialog: null, pendingNew: false, wurf: null, setup: null };
  speichern(); render(); toast('Letzte Eingabe zurückgenommen.');
}

/* ── Rechnen ── */
const wert = e => (e.p ? (e.v || 0) : e.n);
const summe = l => l.reduce((s, e) => s + wert(e), 0);
const bonusBei = i => (i >= 0 ? BONUS[Math.min(i, 6)] : 0);
const R = () => state.rounds[state.cur];
function detail(r) {
  const E = r.f; let basis = 0, bonus = 0;
  if (r.status === 'genullt') { if (r.klammer !== null) { basis = summe(E.slice(0, r.klammer + 1)); bonus = bonusBei(r.klammer); } }
  else { basis = summe(E); bonus = bonusBei(E.length - 1); }
  let p = basis + bonus, dop = false;
  if (r.doppelt && r.status !== 'genullt') { p *= 2; dop = true; }
  p += r.korr || 0;
  const auto = p;
  if (r.override !== null && r.override !== undefined) p = r.override;
  return { basis, bonus, dop, korr: r.korr || 0, auto, punkte: p };
}
const benutzt = r => r.f.length > 0 || r.status !== 'offen' || !!r.korr || r.override !== null;
const punkte = r => detail(r).punkte;
const ersteLeere = () => state.rounds.findIndex(r => !benutzt(r));
const istZukunft = ri => !benutzt(state.rounds[ri]) && ri > ersteLeere();   // noch gar nicht dran: davor gibt es eine leere Runde
const gesamt = () => state.rounds.reduce((s, r) => s + punkte(r), 0);
const nullrunden = () => state.rounds.filter(r => r.status === 'genullt').length;
const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toLocaleString('de-DE');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ── Eingaben ── */
function pruefeVoll(r) {
  if (r.f.length >= FELDER && r.status === 'offen') { r.status = 'gesichert'; toast('Zeile voll – Runde beendet, deine Punkte sind gesichert.'); zielPruefen(); }
}
/* Ziel erreicht und die Runde ist beendet: Die Partie ist vorbei. Endstand + Popup mit den Gesamtpunkten, danach nur noch eine neue Partie.
   Wirkt auf dem nächsten render(); der Aufrufer hat vorher merken() gerufen (↶ holt die Partie zurück). */
const zielErreicht = () => state.phase === 'play' && gesamt() >= ZIEL;
function zielPruefen() {
  if (!zielErreicht()) return false;
  if (mehrere()) { party.zielAktiv = true; return false; }   // mehrere Spieler: die Runde wird für alle zu Ende gespielt
  state.phase = 'done'; state.tab = 'spiel'; state.dialog = { art: 'ziel' }; return true;
}
function zahlTippen(n) {
  const r = R();
  if (r.status !== 'offen') { toast(r.status === 'genullt' ? 'Genullt – du setzt aus, bis die anderen fertig sind.' : 'Du bist raus – deine Runde ist gesichert.'); return; }
  if (r.f.some(e => !e.p && e.n === n)) {
    if (r.zc) {                                   // Wiederholungs-Joker wurde vor dem Wurf angesagt
      merken(); r.zc = false; speichern(); render(false);
      toast('Wiederholungs-Joker greift: Du nullst nicht. Beide Würfel nochmal werfen.'); return;
    }
    state.dialog = { art: 'doppelt', n }; render(false); return;
  }
  merken(); r.f.push({ n }); r.zc = false; pruefeVoll(r); speichern(); render(true);
}
function doppeltWahl(w) {
  const r = R(), n = state.dialog.n; state.dialog = null;
  if (w === 'nullen') {
    merken(); r.status = 'genullt'; r.zc = false; zielPruefen(); speichern(); render(true);
    toast(r.klammer === null ? 'Genullt – 0 Punkte für diese Runde, du setzt aus.' : 'Genullt – die Punkte bis zur Klammer ) bleiben dir.'); return;
  }
  if (w === 'zc') {
    const j = state.joker.find(x => x.typ === 'zc' && x.used === null);
    if (!j) { render(false); toast('Kein freier Zweite-Chance-Joker mehr.'); return; }
    merken(); j.used = state.cur; speichern();
  }
  render(false);
  toast('Die ' + n + ' wird nicht eingetragen – beide Würfel nochmal werfen.');
}
function sichern() { const r = R(); if (r.status !== 'offen' || !r.f.length) return; merken(); r.status = 'gesichert'; r.zc = false; zielPruefen(); speichern(); render(true); }
function nullenKnopf() { const r = R(); if (r.status !== 'offen' || !r.f.length) return; merken(); r.status = 'genullt'; r.zc = false; zielPruefen(); speichern(); render(true); }
function oeffnen() { merken(); R().status = 'offen'; speichern(); render(true); toast('Runde wieder offen.'); }
function letzteWeg() {
  const r = R(); if (!r.f.length) return;
  merken(); feldLoeschen(r, r.f.length - 1); speichern(); render(true);
}
function feldLoeschen(r, i) {
  r.f.splice(i, 1);
  if (r.klammer !== null) { if (i <= r.klammer) r.klammer -= 1; if (r.klammer < 0) r.klammer = null; }
  r.status = 'offen';
}
/* Joker antippen öffnet erst einen Dialog – verbraucht wird nichts ohne „Jetzt einsetzen“ */
function jokerTippen(i) {
  const j = state.joker[i];
  if (state.phase !== 'play') return;
  if (j.typ === null) { state.dialog = { art: 'bonusjoker', slot: i }; render(false); return; }
  state.dialog = { art: 'joker', i }; render(false);
}
function jokerGrund(i) {                          // null = einsetzbar, sonst der Grund als Text
  const r = R(), j = state.joker[i];
  if (r.status !== 'offen') return 'Joker brauchst du in einer laufenden Runde – öffne sie erst wieder.';
  if (j.typ === 'sn' && !r.f.length) return 'Die Klammer ) kommt hinter schon erreichte Punkte – erst etwas eintragen.';
  return null;
}
function jokerEinsetzen(i) {
  const r = R(), j = state.joker[i];
  if (!j || j.typ === null || j.used !== null || jokerGrund(i)) return;
  if (j.typ === 'sn') {
    merken(); r.klammer = r.f.length - 1; j.used = state.cur; speichern(); render(true);
    toast('Klammer ) gesetzt: Deine ' + fmt(summe(r.f)) + ' Punkte sind sicher, auch wenn du später nullst.'); return;
  }
  if (j.typ === 'zc') {
    merken(); j.used = state.cur; r.zc = true; speichern(); render(false);
    toast('Wiederholungs-Joker angesagt: Beim nächsten Wurf nullst du nicht, sondern wirfst nochmal.'); return;
  }
  if (j.typ === 'ep') paschStart(false, true);
}
/* Einen verbrauchten Joker wieder freigeben und seine Wirkung zurücknehmen */
function jokerFreigeben(i) {
  const j = state.joker[i], ri = j.used; if (ri === null) return;
  const r = state.rounds[ri];
  if (j.typ === 'sn' && !state.joker.some((x, k) => k !== i && x.typ === 'sn' && x.used === ri)) r.klammer = null;
  if (j.typ === 'zc') r.zc = false;
  j.used = null;
}
const bonusHat = typ => state.joker.slice(3).some(j => j.typ === typ);
function bonusJokerSetzen(typ) {
  const d = state.dialog; state.dialog = null;
  if (bonusHat(typ)) { render(false); toast('Bonus-Joker ' + JOKERZEICHEN[typ] + ' steht schon im Bonus-Feld – nicht doppelt eingetragen.'); return; }
  merken(); state.joker[d.slot].typ = typ; speichern(); render(false);
  toast('Bonus-Joker ' + JOKERZEICHEN[typ] + ' eingetragen – ab dem nächsten Wurf nutzbar.');
}
/* Karten ziehen: Stapel mischen (kein Vorgucken durch Abbrechen), die obersten Karten zeigen.
   Verbraucht werden sie erst in paschFertig. Ist der Stapel zu klein, wird der Ablagestapel eingemischt. */
function kartenZiehen(n) {
  if (party.deck.length < n) { party.deck = mischen(party.deck.concat(party.ablage)); party.ablage = []; }
  else party.deck = mischen(party.deck);
  return party.deck.slice(0, n);
}
function kartenVerbrauchen(ks) { ks.forEach(k => { const i = party.deck.indexOf(k); if (i >= 0) party.deck.splice(i, 1); party.ablage.push(k); }); }
function paschStart(eule, extra) {
  const d = { art: 'pasch', extra: !!extra, eule: !!eule, schritt: 0 };
  if (party.digK) d.karten = kartenZiehen(eule ? EULENPASCHKARTEN : PASCHKARTEN);
  state.dialog = d; render(false);
}
function paschOeffnen() { if (R().status !== 'offen') return; paschStart(false, false); }
function paschFertig(v, fx) {
  const r = R(), d = state.dialog; merken();
  if (d.karten) kartenVerbrauchen(d.karten);
  if (d.extra) { const j = state.joker.find(x => x.typ === 'ep' && x.used === null); if (j) j.used = state.cur; }
  r.f.push({ p: true, v: v || 0, eule: !!d.eule }); r.zc = false;
  let extra = '';
  if (fx === 'doppelt') { r.doppelt = true; extra = ' Die Runde zählt doppelt.'; }
  if (fx === 'bsn' || fx === 'bzc') {
    const typ = fx === 'bsn' ? 'sn' : 'zc', slot = state.joker.slice(3).find(x => x.typ === null);
    if (bonusHat(typ)) extra = ' Bonus-Joker ' + JOKERZEICHEN[typ] + ' stand schon im Bonus-Feld – nicht doppelt eingetragen.';
    else if (slot) { slot.typ = typ; extra = ' Bonus-Joker ' + JOKERZEICHEN[typ] + ' eingetragen.'; }
    else extra = ' Beide Bonus-Joker-Felder sind schon belegt.';
  }
  state.dialog = null; pruefeVoll(r); speichern(); render(true);
  toast('P' + (v ? ' mit ' + v + ' Punkten' : '') + ' eingetragen.' + extra);
}
function rundeWechseln(i) { if (i < 0 || i >= RUNDEN) return; state.cur = i; state.wurf = null; speichern(); render(false); }

/* ── Digitale Würfel ── */
function wuerfeln() {
  const r = R();
  if (state.phase !== 'play' || (state.wurf && state.wurf.rolling)) return;
  if (r.status !== 'offen') { toast(r.status === 'genullt' ? 'Genullt – du setzt aus, bis die anderen fertig sind.' : 'Du bist raus – deine Runde ist gesichert.'); return; }
  const w = { a: zufall(12) + 1, b: zufall(12) + 1, rolling: WURFDAUER > 0, text: '' };
  state.wurf = w; render(false);
  const fertig = () => { if (state.wurf !== w) return; w.rolling = false; auswerten(w); };
  if (WURFDAUER > 0) setTimeout(fertig, WURFDAUER); else fertig();
}
/* Regeln: zwei Eulen = Pasch. Gleiche Zahl auf beiden Würfeln = Pasch. Sonst zählt der höhere Würfel (die Eule gilt als 1).
   Eule + Zahl, die schon in der Zeile steht: Eule rettet, nichts wird eingetragen, nochmal würfeln.
   Zahl schon in der Zeile ohne Eule: genullt (außer ein Wiederholungs-Joker wurde vorher angesagt). */
function auswerten(w) {

    if (c.mal) { d.schritt = 1; d.mal = c.mal; d.wahl = k; render(false); }
    else paschFertig(c.v || 0, c.fx);
  }
  else if (a === 'kwurf') { const d = state.dialog; if (!d.wurf) d.wurf = { a: zufall(12) + 1, b: zufall(12) + 1, anim: WURFDAUER > 0 }; render(false); d.wurf.anim = false; }
  else if (a === 'kok') { const d = state.dialog; if (d.wurf) paschFertig(wurfWert(d.wurf.a, d.wurf.b) * d.mal); }
  else if (a === 'su-m') { setupLesen(); state.setup.modus = b.dataset.w; render(false); }
  else if (a === 'su-n') { setupLesen(); state.setup.n = Math.max(2, Math.min(6, state.setup.n + (+b.dataset.d))); render(false); }
  else if (a === 'su-w') { setupLesen(); state.setup.digW = b.dataset.w === '1'; render(false); }
  else if (a === 'su-g') { setupLesen(); state.setup.geist = +b.dataset.w; render(false); }
  else if (a === 'su-k') { setupLesen(); state.setup.digK = b.dataset.w === '1'; render(false); }
  else if (a === 'zsehen') { state.dialog = null; render(false); window.scrollTo(0, 0); }
  else if (a === 'znew') { state.dialog = null; state.setup = defaultSetup(); state.pendingNew = true; render(false); }
  else if (a === 'undo') zurueck();
  else if (a === 'wake') toggleWake();
  else if (a === 'fs') toggleFS();
  else if (a === 'new') { state.setup = defaultSetup(); state.pendingNew = true; render(false); }
  else if (a === 'setup-cancel') { state.pendingNew = false; state.setup = null; render(false); }
  else if (a === 'setup') {
    setupLesen();
    const su = state.setup || defaultSetup(), n = su.modus === 'multi' ? su.n : 1;
    const namen = Array.from({ length: n }, (_, k) => (su.namen[k] || '').trim() || (n > 1 ? 'Spieler ' + (k + 1) : ''));
    if (state.setupDone) merken();
    party = neuePartie(namen, su.digW, su.digK, n === 1 ? (su.geist || 0) : 0);
    state = { ...neuerStand(), setupDone: true, ...kopie(party.sheets[0]) };
    speichern(); hideToast(); render(false); window.scrollTo(0, 0);
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (state.pendingNew && state.setupDone) { state.pendingNew = false; render(false); } else if (state.dialog) { state.dialog = null; render(false); } }
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'name-in') { const b = document.querySelector('[data-a="setup"]'); if (b) b.click(); }
});

async function acquireWake() {
  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); return true; } catch (e) {}
  }
  try { const v = makeNoSleepVideo(); await v.play(); return !v.paused; } catch (e) { return false; }
}
function releaseWake() { if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; } if (noSleepVid) { try { noSleepVid.pause(); } catch (e) {} } }
async function toggleWake() {
  if (wakeWanted) { wakeWanted = false; releaseWake(); savePrefs(); render(false); toast('Display darf sich wieder ausschalten.'); }
  else { wakeWanted = true; savePrefs(); const ok = await acquireWake(); render(false);
    toast(ok ? 'Display bleibt jetzt an.' : 'Dein Browser erlaubt das hier nicht. Im Vollbild oder in einem eigenen Tab klappt es meist.'); }
}
function fsActive() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
async function toggleFS() {
  try {
    if (fsActive()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) { toast('Vollbild wird von diesem Browser nicht unterstützt.'); return; } await fn.call(el); }
  } catch (e) { toast('Vollbild wurde blockiert. Öffne die App in einem eigenen Tab.'); }
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById('hd-toast');
  if (!t) { t = document.createElement('div'); t.id = 'hd-toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4800);
}
function hideToast() { clearTimeout(toastTimer); const t = document.getElementById('hd-toast'); if (t) t.style.display = 'none'; }
function savePrefs() { try { localStorage.setItem(PREFS, wakeWanted ? '1' : '0'); } catch (e) {} }
function loadPrefs() { try { wakeWanted = localStorage.getItem(PREFS) === '1'; } catch (e) {} }
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeWanted && !wakeActive()) { await acquireWake(); render(false); }
});
document.addEventListener('fullscreenchange', () => render(false));
document.addEventListener('webkitfullscreenchange', () => render(false));

laden(); loadPrefs(); render(false);
if (wakeWanted) acquireWake().then(() => render(false));
